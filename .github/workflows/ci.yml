name: CI Quality Gate & Benchmark Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Pytest & Benchmark Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    env:
      # windows-latest starts each Python process on a legacy code page (cp1252),
      # which cannot encode this project's Chinese log output.
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Verify 28 Benchmark Cases Database Integrity
        run: uv run python src/benchmark/build_real_cases.py

      - name: Run Full Pytest Test Suite
        run: uv run pytest -v --durations=10

      - name: External Blind Benchmarks (synthetic + CSRC hold-out, offline)
        env:
          DEEPSEEK_API_KEY: mock-key
        run: |
          uv run python -m src.benchmark.blind_synthetic --seeds 20
          uv run python -m src.benchmark.blind_real --mode mock

  frontend-build:
    name: Frontend Vite & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Modern Frontend Production Dist
        working-directory: ./frontend
        run: npm run build
